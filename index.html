<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks &amp; Notes</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef2f0;--card:#fff;--ink:#1c2b27;--mute:#6b7c76;--line:#d7e0dc;--accent:#0f766e;--done:#9aa9a4;--danger:#b4412f}
@media (prefers-color-scheme:dark){:root{--bg:#121a18;--card:#1b2623;--ink:#e6efec;--mute:#8fa19b;--line:#2c3a36;--accent:#2dd4bf;--done:#5d6e68;--danger:#f08a76}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
main{max-width:560px;margin:0 auto;padding:20px 16px 100px}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:-.5px}
#count{color:var(--mute);margin:0 0 16px;font-size:14px}
form{display:flex;gap:8px;margin-bottom:12px}
input[type=text],textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
form input[type=text]{flex:1;min-width:0;width:auto}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;color:inherit}
.add{background:var(--accent);color:#fff;padding:10px 18px;font-weight:700}
@media (prefers-color-scheme:dark){.add{color:#06201c}}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{background:transparent;color:var(--mute);padding:7px 14px;border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
li input{width:22px;height:22px;accent-color:var(--accent);flex:none}
li .txt{flex:1;min-width:0;word-break:break-word}
li.done .t{text-decoration:line-through;color:var(--done)}
.meta{display:block;font-size:12px;color:var(--mute);margin-top:2px}
li .del{background:none;color:var(--danger);font-size:20px;padding:0 6px}
.empty{text-align:center;color:var(--mute);padding:28px 0;justify-content:center}
.clear{background:none;color:var(--mute);text-decoration:underline;padding:8px 0;margin-top:6px}
.note{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);padding:12px;margin-bottom:8px}
.note strong{display:block}
.note .pv{display:block;color:var(--mute);font-size:14px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.bar button{background:none;color:var(--accent);padding:8px 4px;font-weight:700}
.bar .rm{color:var(--danger)}
#ntitle{font-weight:700;font-size:20px;margin-bottom:8px}
#nbody{min-height:50vh;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);line-height:1.5;outline:none;overflow-wrap:anywhere}
#nbody:empty::before{content:attr(data-ph);color:var(--mute)}
#nbody ul,#nbody ol{display:block;margin:6px 0;padding-left:26px}
#nbody ul{list-style:disc}#nbody ol{list-style:decimal}
#nbody li{display:list-item;background:none;border:0;border-radius:0;padding:0;margin:0}
#nbody h3{margin:8px 0 4px;font-size:18px}
.fmt{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.fmt button{background:var(--card);border:1px solid var(--line);min-width:42px;padding:8px 10px}
.bar span{display:flex;gap:8px}
#vlang{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
#mic[aria-pressed=true],#rec[aria-pressed=true]{background:var(--danger);color:#fff;border-color:var(--danger)}
.clip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.clip audio{width:100%;margin:6px 0}
.clip button{background:none;color:var(--danger);padding:4px 0}
#vstat{flex-basis:100%;margin:0}
#nsearch{margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;padding:14px 0;color:var(--mute);border-radius:0;font-weight:700}
nav button.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
#auth{max-width:560px;margin:0 auto;padding:28px 16px}
#reg{flex-direction:column;align-items:stretch}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt[aria-disabled=true]{opacity:.55}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="auth" hidden>
 <h1>Welcome</h1>
 <p class="meta" style="font-size:14px;margin:0 0 16px">Create your profile once. Your tasks and notes are saved under it.</p>
 <div id="plabel"><strong>Your profiles</strong></div>
 <div id="plist" style="margin:8px 0 20px"></div>
 <form id="reg">
  <input type="text" id="pname" placeholder="Your name" autocomplete="name" aria-label="Your name">
  <label class="opt"><input type="radio" name="st" checked><span><strong>This device</strong><small class="meta">Saved in this app on this phone. Not shared with anyone else.</small></span></label>
  <label class="opt" aria-disabled="true"><input type="radio" name="st" disabled><span><strong>Google account</strong><small class="meta">Not available yet. It needs a Google sign-in setup first.</small></span></label>
  <small id="perr" class="meta" style="color:var(--danger)"></small>
  <button class="add" type="submit">Create profile and start</button>
 </form>
</div>
<main id="app" hidden>
 <div class="bar" style="margin-bottom:0"><small class="meta" style="margin:0">Profile: <b id="who"></b></small><button id="switch">Switch user</button></div>
 <section id="p-tasks">
  <h1>My Tasks</h1>
  <p id="count"></p>
  <form id="f">
    <input type="text" id="t" placeholder="Add a task" autocomplete="off" aria-label="New task">
    <button class="add" type="submit">Add</button>
  </form>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">All</button>
    <button data-f="open">To do</button>
    <button data-f="done">Done</button>
  </div>
  <ul id="list"></ul>
  <button class="clear" id="clr">Clear completed</button>
 </section>

 <section id="p-notes" hidden>
  <div id="nlistview">
    <h1>Notes</h1>
    <p id="ncount" style="color:var(--mute);margin:0 0 16px;font-size:14px"></p>
    <button class="add" id="newnote" style="width:100%;margin-bottom:12px">New note</button>
    <input type="text" id="nsearch" placeholder="Search notes" aria-label="Search notes" autocomplete="off">
    <div id="notelist"></div>
  </div>
  <div id="editor" hidden>
    <div class="bar">
      <button id="back">&lsaquo; All notes</button>
      <span><button id="npin">Pin</button><button id="ndel" class="rm">Delete</button></span>
    </div>
    <div id="nmeta" class="meta" style="font-size:13px;margin:0 0 8px"></div>
    <input type="text" id="ntitle" placeholder="Title" aria-label="Note title" autocomplete="off">
    <div class="fmt" id="fmt">
      <button data-c="bold" aria-label="Bold"><b>B</b></button>
      <button data-c="italic" aria-label="Italic"><i>I</i></button>
      <button data-c="underline" aria-label="Underline"><u>U</u></button>
      <button data-c="h" aria-label="Heading">Heading</button>
      <button data-c="insertUnorderedList" aria-label="Bullet list">Bullets</button>
      <button data-c="insertOrderedList" aria-label="Numbered list">Numbers</button>
    </div>
    <div class="fmt" id="voice">
      <button id="rec" type="button" aria-pressed="false">Record audio</button>
      <button id="mic" type="button" aria-pressed="false">Speech to text</button>
      <select id="vlang" aria-label="Language you will speak">
        <option value="en-IN">English</option>
        <option value="ta-IN">Tamil (translate to English)</option>
      </select>
      <small class="meta" id="vstat" aria-live="polite"></small>
    </div>
    <div id="nbody" contenteditable="true" data-ph="Write your note" role="textbox" aria-multiline="true" aria-label="Note text"></div>
    <div id="clips"></div>
    <small class="meta" id="nsaved" aria-live="polite"></small>
  </div>
 </section>
</main>
<nav id="appnav" hidden>
  <button id="nav-tasks" class="on">Tasks</button>
  <button id="nav-notes">Notes</button>
</nav>
<script>
const $ = id => document.getElementById(id);
function fmt(ms) {
  return new Date(ms).toLocaleString([], { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
}
function load(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ---------- Tasks ---------- */
let TK = null, NK = null;
let tasks = [], filter = "all";
const saveTasks = () => { if (TK) store(TK, tasks); };

function renderTasks() {
  const list = $("list");
  list.innerHTML = "";
  const shown = tasks.filter(t => filter === "all" || (filter === "done") === t.done);
  shown.forEach(t => {
    const li = document.createElement("li");
    if (t.done) li.className = "done";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = t.done;
    cb.onchange = () => { t.done = cb.checked; t.doneAt = cb.checked ? Date.now() : null; saveTasks(); renderTasks(); };
    const sp = document.createElement("div");
    sp.className = "txt";
    const tt = document.createElement("span");
    tt.className = "t"; tt.textContent = t.text;
    sp.appendChild(tt);
    const parts = [];
    if (t.created) parts.push("Added " + fmt(t.created));
    if (t.done && t.doneAt) parts.push("Done " + fmt(t.doneAt));
    if (parts.length) {
      const m = document.createElement("small");
      m.className = "meta"; m.textContent = parts.join(" | ");
      sp.appendChild(m);
    }
    const d = document.createElement("button");
    d.className = "del"; d.textContent = "×"; d.setAttribute("aria-label", "Delete task");
    d.onclick = () => { tasks = tasks.filter(x => x.id !== t.id); saveTasks(); renderTasks(); };
    li.append(cb, sp, d);
    list.appendChild(li);
  });
  if (!shown.length) {
    const e = document.createElement("li");
    e.className = "empty";
    e.textContent = tasks.length ? "Nothing here." : "No tasks yet. Add your first one above.";
    list.appendChild(e);
  }
  const left = tasks.filter(t => !t.done).length;
  $("count").textContent = left + " to do, " + (tasks.length - left) + " done";
}
$("f").onsubmit = e => {
  e.preventDefault();
  const text = $("t").value.trim();
  if (!text) return;
  tasks.unshift({ id: Date.now(), text, done: false, created: Date.now(), doneAt: null });
  $("t").value = ""; saveTasks(); renderTasks();
};
$("tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  renderTasks();
};
$("clr").onclick = () => { tasks = tasks.filter(t => !t.done); saveTasks(); renderTasks(); };

/* ---------- Notes ---------- */
let notes = [], current = null, armed = false;
const saveNotes = () => { if (NK) store(NK, notes); };

function plain(n) {
  if (!n.rich) return n.body || "";
  const d = document.createElement("div");
  d.innerHTML = n.body || "";
  return d.textContent;
}
function renderNotes() {
  const box = $("notelist");
  box.innerHTML = "";
  const q = $("nsearch").value.trim().toLowerCase();
  const shownN = notes.filter(n => !q || (n.title + " " + plain(n)).toLowerCase().includes(q))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updated - a.updated);
  shownN.forEach(n => {
    const b = document.createElement("button");
    b.className = "note";
    const h = document.createElement("strong");
    h.textContent = (n.pinned ? "\uD83D\uDCCC " : "") + (n.title || "Untitled note");
    const p = document.createElement("span");
    const pt = plain(n).replace(/\s+/g, " ").trim();
    p.className = "pv"; p.textContent = pt ? pt.slice(0, 90) : (n.audios && n.audios.length ? "Voice recording" : "No text");
    const m = document.createElement("small");
    m.className = "meta"; m.textContent = "Taken " + fmt(n.created) + " | Edited " + fmt(n.updated);
    b.append(h, p, m);
    b.onclick = () => openNote(n.id);
    box.appendChild(b);
  });
  if (!shownN.length) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = notes.length ? "No notes match your search." : "No notes yet. Tap New note to start.";
    box.appendChild(e);
  }
  $("ncount").textContent = notes.length + (notes.length === 1 ? " note" : " notes");
}
function metaLine() {
  const words = plain(current).trim().split(/\s+/).filter(Boolean).length;
  $("nmeta").textContent = "Taken " + fmt(current.created) + " | Last edited " + fmt(current.updated) + " | " + words + (words === 1 ? " word" : " words");
}
function openNote(id) {
  current = notes.find(n => n.id === id);
  if (!current) return;
  armed = false; $("ndel").textContent = "Delete"; $("nsaved").textContent = "Changes save automatically"; $("vstat").textContent = ""; renderClips();
  $("ntitle").value = current.title;
  $("nbody").innerHTML = current.rich ? current.body : (current.body || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\n/g, "<br>");
  $("npin").textContent = current.pinned ? "Unpin" : "Pin";
  metaLine();
  $("nlistview").hidden = true; $("editor").hidden = false;
  if (!current.body && !current.title) $("ntitle").focus();
}
function closeNote() {
  stopVoice();
  stopAudio();
  if (current && !current.title.trim() && !plain(current).trim() && !(current.audios && current.audios.length)) {
    notes = notes.filter(n => n.id !== current.id); saveNotes();
  }
  current = null;
  $("editor").hidden = true; $("nlistview").hidden = false;
  renderNotes();
}
function onEdit() {
  if (!current) return;
  current.title = $("ntitle").value;
  current.body = $("nbody").innerHTML; current.rich = true;
  current.updated = Date.now();
  saveNotes(); metaLine();
  $("nsaved").textContent = "Saved automatically";
}
$("newnote").onclick = () => {
  const n = { id: Date.now(), title: "", body: "", created: Date.now(), updated: Date.now() };
  notes.unshift(n); saveNotes(); openNote(n.id);
};
$("ntitle").oninput = onEdit;
$("nsearch").oninput = renderNotes;
$("npin").onclick = () => {
  current.pinned = !current.pinned;
  $("npin").textContent = current.pinned ? "Unpin" : "Pin";
  saveNotes();
};
$("fmt").onmousedown = e => e.preventDefault();
$("fmt").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  $("nbody").focus();
  if (b.dataset.c === "h") {
    document.execCommand("formatBlock", false, document.queryCommandValue("formatBlock").toLowerCase() === "h3" ? "div" : "h3");
  } else document.execCommand(b.dataset.c);
  onEdit();
};
$("nbody").onpaste = e => {
  e.preventDefault();
  document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain"));
};
$("nbody").oninput = onEdit;
$("back").onclick = closeNote;
$("ndel").onclick = () => {
  if (!armed) { armed = true; $("ndel").textContent = "Tap again to delete"; return; }
  (current.audios || []).forEach(a => delClip(a.id));
  notes = notes.filter(n => n.id !== current.id); saveNotes();
  current = null; closeNote();
};

/* ---------- Navigation ---------- */
function show(page) {
  $("p-tasks").hidden = page !== "tasks";
  $("p-notes").hidden = page !== "notes";
  $("nav-tasks").classList.toggle("on", page === "tasks");
  $("nav-notes").classList.toggle("on", page === "notes");
  window.scrollTo(0, 0);
}
$("nav-tasks").onclick = () => show("tasks");
$("nav-notes").onclick = () => show("notes");

/* ---------- Voice to text ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, samplePromise = null;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function setMic(on) {
  $("mic").textContent = on ? "Stop" : "Speech to text";
  $("mic").setAttribute("aria-pressed", on ? "true" : "false");
}
function stopVoice() {
  listening = false;
  if (rec) { try { rec.stop(); } catch (e) {} }
  setMic(false);
}
function getSample() {
  if (!samplePromise) samplePromise = (async () => {
    try { return (typeof claude !== "undefined" && claude.use) ? await claude.use("sample") : null; } catch (e) { return null; }
  })();
  return samplePromise;
}
async function translateTa(text) {
  const s = await getSample();
  if (s) {
    try {
      const r = await s("Translate this Tamil text to English. Reply with only the English translation, nothing else.\n\n" + text, { modelTier: "quick", cache: false });
      const t = (r.text || "").trim();
      if (t) return t;
    } catch (e) {}
  }
  try {
    const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=ta|en");
    const j = await r.json();
    const t = j && j.responseData && j.responseData.translatedText;
    if (t && j.responseStatus == 200) return t;
  } catch (e) {}
  return null;
}
function addToNote(n, text) {
  if (current === n) {
    const d = document.createElement("div");
    d.textContent = text;
    $("nbody").appendChild(d);
    onEdit();
  } else {
    n.body = (n.rich ? n.body : esc(n.body || "").replace(/\n/g, "<br>")) + "<div>" + esc(text) + "</div>";
    n.rich = true; n.updated = Date.now(); saveNotes();
  }
}
async function addSpoken(text) {
  const n = current;
  if (!text || !n) return;
  if (/[\u0B80-\u0BFF]/.test(text)) {
    $("vstat").textContent = "Translating Tamil to English...";
    const t = await translateTa(text);
    if (t) { addToNote(n, t); $("vstat").textContent = listening ? "Listening..." : "Translated to English."; }
    else { addToNote(n, text); $("vstat").textContent = "Could not translate, so the Tamil text was saved. Check your internet connection."; }
  } else addToNote(n, text);
}
$("mic").onclick = () => {
  if (recording) stopAudio();
  if (!SR) { $("vstat").textContent = "Voice typing is not supported here. Open the app in Chrome, or use the microphone key on your keyboard."; return; }
  if (listening) { stopVoice(); $("vstat").textContent = ""; return; }
  rec = new SR();
  rec.lang = $("vlang").value; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) addSpoken(r[0].transcript.trim()); else interim += r[0].transcript;
    }
    if (interim) $("vstat").textContent = "Hearing: " + interim;
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
      listening = false; setMic(false);
      $("vstat").textContent = micHelp(e.error);
    } else if (e.error === "no-speech") $("vstat").textContent = "No speech heard.";
    else if (e.error !== "aborted") $("vstat").textContent = "Voice error: " + e.error;
  };
  rec.onend = () => { if (listening) { try { rec.start(); } catch (e) { stopVoice(); } } else setMic(false); };
  listening = true; setMic(true); $("vstat").textContent = "Listening...";
  try { rec.start(); } catch (e) { stopVoice(); }
};

/* ---------- Audio recorder ---------- */
let mr = null, recording = false, rTimer = null, clipUrls = [], clipTok = 0;
function micHelp(code) {
  const c = " (" + (code || "blocked") + ")";
  if (window.self !== window.top) return "The microphone is blocked because this page is opened inside another page" + c + ". Download todo.html and open it in Chrome.";
  return "Microphone problem" + c + ". Allow microphone access in your browser or phone settings, then try again.";
}
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function clipDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("notes-audio", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("clips");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function clipOp(mode, fn) {
  const db = await clipDB();
  return new Promise((res, rej) => {
    const t = db.transaction("clips", mode);
    const req = fn(t.objectStore("clips"));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
}
const putClip = (id, blob) => clipOp("readwrite", s => s.put(blob, id));
const getClip = id => clipOp("readonly", s => s.get(id));
const delClip = id => clipOp("readwrite", s => s.delete(id)).catch(() => {});
async function renderClips() {
  const tok = ++clipTok, n = current, box = $("clips");
  clipUrls.forEach(u => URL.revokeObjectURL(u)); clipUrls = [];
  box.innerHTML = "";
  if (!n || !n.audios || !n.audios.length) return;
  for (const a of n.audios) {
    const d = document.createElement("div"); d.className = "clip";
    const m = document.createElement("small"); m.className = "meta";
    m.textContent = "Recorded " + fmt(a.created) + " | " + mmss(a.secs || 0);
    d.appendChild(m);
    let blob = null;
    try { blob = await getClip(a.id); } catch (e) {}
    if (tok !== clipTok) return;
    if (blob) {
      const au = document.createElement("audio"); au.controls = true;
      const u = URL.createObjectURL(blob); clipUrls.push(u); au.src = u;
      d.appendChild(au);
    } else {
      const w = document.createElement("small"); w.className = "meta"; w.textContent = "Audio file not found.";
      d.appendChild(w);
    }
    const b = document.createElement("button"); b.type = "button"; b.textContent = "Delete recording";
    let sure = false;
    b.onclick = () => {
      if (!sure) { sure = true; b.textContent = "Tap again to delete"; return; }
      n.audios = n.audios.filter(x => x.id !== a.id);
      delClip(a.id); n.updated = Date.now(); saveNotes(); renderClips();
    };
    d.appendChild(b);
    box.appendChild(d);
  }
}
function stopAudio() {
  if (mr && mr.state !== "inactive") { try { mr.stop(); } catch (e) {} }
}
async function startAudio() {
  if (!navigator.mediaDevices || !window.MediaRecorder || !window.indexedDB) {
    $("vstat").textContent = "Audio recording is not supported here. Open the app in Chrome."; return;
  }
  const n = current; if (!n) return;
  stopVoice();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { $("vstat").textContent = micHelp(e && e.name); return; }
  const chunks = [], t0 = Date.now();
  mr = new MediaRecorder(stream);
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(rTimer); recording = false;
    $("rec").textContent = "Record audio"; $("rec").setAttribute("aria-pressed", "false");
    const secs = (Date.now() - t0) / 1000;
    if (!chunks.length) return;
    const blob = new Blob(chunks, { type: chunks[0].type || "audio/webm" });
    const id = "a" + Date.now().toString(36);
    try {
      await putClip(id, blob);
      n.audios = n.audios || [];
      n.audios.push({ id, created: Date.now(), secs });
      n.updated = Date.now(); saveNotes();
      if (current === n) { renderClips(); metaLine(); $("vstat").textContent = "Recording saved to this note."; }
    } catch (e) { if (current === n) $("vstat").textContent = "Could not save the recording."; }
  };
  mr.start();
  recording = true;
  $("rec").textContent = "Stop"; $("rec").setAttribute("aria-pressed", "true");
  rTimer = setInterval(() => { $("vstat").textContent = "Recording " + mmss((Date.now() - t0) / 1000); }, 500);
}
$("rec").onclick = () => { if (recording) stopAudio(); else startAudio(); };

/* ---------- Profiles ---------- */
const PK = "app-profiles-v1", AK = "app-active-profile-v1";
let profiles = load(PK);
function startApp(p) {
  try { localStorage.setItem(AK, p.id); } catch (e) {}
  TK = "todo-app-v1:" + p.id; NK = "notes-app-v1:" + p.id;
  tasks = load(TK); notes = load(NK);
  current = null; filter = "all";
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x.dataset.f === "all"));
  $("editor").hidden = true; $("nlistview").hidden = false;
  $("who").textContent = p.name;
  $("auth").hidden = true; $("app").hidden = false; $("appnav").hidden = false;
  show("tasks"); renderTasks(); renderNotes();
}
function showAuth() {
  $("app").hidden = true; $("appnav").hidden = true; $("auth").hidden = false;
  const box = $("plist"); box.innerHTML = "";
  profiles.forEach(p => {
    const b = document.createElement("button");
    b.className = "note"; b.textContent = "Continue as " + p.name;
    b.onclick = () => startApp(p);
    box.appendChild(b);
  });
  $("plabel").hidden = !profiles.length;
}
$("reg").onsubmit = e => {
  e.preventDefault();
  const name = $("pname").value.trim();
  if (!name) { $("perr").textContent = "Enter your name to continue."; return; }
  const p = { id: "u" + Date.now().toString(36), name, storage: "local", created: Date.now() };
  if (!profiles.length) { // first profile adopts data saved before profiles existed
    const lt = load("todo-app-v1"), ln = load("notes-app-v1");
    if (lt.length) store("todo-app-v1:" + p.id, lt);
    if (ln.length) store("notes-app-v1:" + p.id, ln);
  }
  profiles.push(p); store(PK, profiles);
  $("pname").value = ""; $("perr").textContent = "";
  startApp(p);
};
$("switch").onclick = () => {
  if (current) closeNote();
  saveTasks(); saveNotes();
  TK = NK = null; tasks = []; notes = [];
  try { localStorage.removeItem(AK); } catch (e) {}
  showAuth();
};
window.addEventListener("pagehide", () => { saveTasks(); saveNotes(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { saveTasks(); saveNotes(); } });
let lastId = null;
try { lastId = localStorage.getItem(AK); } catch (e) {}
const lastP = profiles.find(x => x.id === lastId);
if (lastP) startApp(lastP); else showAuth();
</script>
